name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: smoke gate
        run: bash scripts/smoke.sh
      - name: verify gate
        run: bash scripts/verify.sh
      - name: req-adr check
        run: bash scripts/check.sh
      - name: skill lint
        run: bash scripts/skill-lint.sh
      # 不在 CI 跑的闸（本仓无守的对象，有对象时再接回）：
      # predev-lint（无 REQ/BRIEF/DESIGN/ARCH/DFX 文档）、plan-lint（无 PLAN）、
      # arch --gate（无 src、无 catalog，接回即受 EMPTY_SCAN 约束）。

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: powershell parse
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw setup.ps1), [ref]$errs)
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Output $_.Message }; exit 1 }
          Write-Output "setup.ps1: parse OK"
